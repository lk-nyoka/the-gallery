[tool.ruff]
line-length = 120
target-version = "py310"
src = ["backend"]

[tool.ruff.lint]
# Real bugs only: syntax errors, undefined names, unused imports/variables, bad comparisons.
select = ["E9", "F", "B006", "B008"]
ignore = ["F841"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
